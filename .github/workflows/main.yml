name: Build APK WITHOUT SECRETS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract application source
        run: |
          test -s source.zip || { echo 'source.zip is missing'; exit 1; }
          unzip -q source.zip
          test -f NicotineIntervals/app/build.gradle

      - name: Compile debug APK
        working-directory: NicotineIntervals
        run: gradle :app:assembleDebug --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: NicotineIntervals-v2-debug
          path: NicotineIntervals/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
