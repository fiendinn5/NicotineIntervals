name: Build NicotineIntervals signed APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'source.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unpack source
        shell: bash
        run: |
          test -s source.zip || { echo 'Upload source.zip to repo root'; exit 1; }
          unzip -q source.zip
          test -f NicotineIntervals/app/build.gradle

      - name: Build signed RELEASE APK
        shell: bash
        working-directory: NicotineIntervals
        env:
          NI_KEYSTORE_BASE64: ${{ secrets.NI_KEYSTORE_BASE64 }}
          NI_KEYSTORE_PASSWORD: ${{ secrets.NI_KEYSTORE_PASSWORD }}
          NI_KEY_ALIAS: ${{ secrets.NI_KEY_ALIAS }}
          NI_KEY_PASSWORD: ${{ secrets.NI_KEY_PASSWORD }}
        run: |
          test -n "$NI_KEYSTORE_BASE64" || { echo 'Missing NI_KEYSTORE_BASE64 repository secret'; exit 1; }
          test -n "$NI_KEYSTORE_PASSWORD" || { echo 'Missing NI_KEYSTORE_PASSWORD repository secret'; exit 1; }
          test -n "$NI_KEY_ALIAS" || { echo 'Missing NI_KEY_ALIAS repository secret'; exit 1; }
          test -n "$NI_KEY_PASSWORD" || { echo 'Missing NI_KEY_PASSWORD repository secret'; exit 1; }
          printf '%s' "$NI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nicotineintervals-release.jks"
          export NI_KEYSTORE_FILE="$RUNNER_TEMP/nicotineintervals-release.jks"
          gradle :app:assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NicotineIntervals-v2-signed-apk
          path: NicotineIntervals/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
