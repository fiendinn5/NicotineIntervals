      - name: Fix v1.1 compile issue
        shell: bash
        run: |
          sed -i 's/setMinimumHeight(dp(260));/setMinimumHeight((int) dp(260));/' NicotineIntervals/app/src/main/java/ru/vitaliy/nicotineintervals/VascularChartView.java

      - name: Build debug APK
        working-directory: NicotineIntervals
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NicotineIntervals-v1.1-debug-apk
          path: NicotineIntervals/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
